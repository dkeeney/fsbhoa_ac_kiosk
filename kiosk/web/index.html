<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSBHOA Kiosk</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <input type="text" readonly inputmode="none" id="card-reader-input" style="position: absolute; left: -9999px;">

    <div id="idle-screen">
        <img id="logo-image" src="" alt="HOA Logo" style="visibility: hidden; max-width: 80%; max-height: 300px; margin: 20px auto; display: block;">
        <h1>Welcome to the Lodge</h1>
    </div>
    <h2 id="status-message">Status: Connecting...</h2>
    <hr>

    <div id="splash-screen">
        <img id="splash-image" src="" alt="Thank You">
    </div>


    <table id="main-layout-table">
        <tr>
            <td id="left-column-cell">
                <div id="last-card-swipe" style="font-size: 24px; font-weight: bold; min-height: 30px;"></div>

                <div id="guest-buttons-container" class="kiosk-step-container">
                    <h2>How many guests are with you?</h2>
                    <div id="guest-buttons"></div>
                </div>
                <div id="amenity-buttons-container" class="kiosk-step-container">
                    <h2 class="amenity-title">Please select a destination</h2>
                    <div id="amenity-buttons"></div>
                </div>
            </td>

            <td id="right-column-cell">
                <div id="card-display" class="card-display-hidden">
                    <img id="card-photo" src="" alt="Cardholder Photo">
                    <div id="card-name"></div>
                </div>
            </td>
        </tr>
    </table>

    <script src="/app.js"></script>
<style>
        #debug-wrapper {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 450px;
            z-index: 100000;
            display: none; /* Toggled by JS */
            pointer-events: auto;
        }
        #simulator-bar {
            background-color: rgba(0, 0, 0, 0.95);
            border: 2px solid #444;
            border-bottom: none;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', monospace;
            color: #0f0;
            font-size: 13px;
        }
        #debug-log {
            width: 100%;
            height: 300px;
            background-color: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 2px solid #444;
            overflow-y: scroll;
            padding: 10px;
            text-align: left;
            white-space: pre-wrap;
            user-select: text;
            box-sizing: border-box; /* Ensure padding doesn't break width */
        }
        #sim-card-input:focus {
            outline: 1px solid #0f0;
        }
    </style>
    
    <div id="debug-wrapper">
        <div id="simulator-bar">
            <button onclick="triggerManualSwipe()" style="background: #222; color: #0f0; border: 1px solid #444; padding: 6px 10px; cursor: pointer; width: 100%; font-weight: bold;">
                Simulate Swipe (Card: 11111111)
            </button>
        </div>
        <div id="debug-log"></div>
    </div>
</body>
</html>
