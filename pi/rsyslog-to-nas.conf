# Send the whole log to the NAS (nas, 192.168.42.99, TCP 514) and keep nothing locally:
# this Pi's / is a RAM overlay (read-only SD), so local files would only fill RAM and vanish
# at reboot. On the NAS: /var/log/remote/kiosk.log (90 days). 2026-11-21, home (dkeen asked).
*.* action(type="omfwd" target="192.168.42.99" port="514" protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format"
           queue.type="LinkedList" queue.size="50000"
           action.resumeRetryCount="-1" action.resumeInterval="10")
stop
