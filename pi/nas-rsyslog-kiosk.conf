# NAS side of the kiosk log forwarding (reference copy; installed by hand on nas 2026-11-21).
# /etc/rsyslog.d/30-remote-kiosk.conf:
# Lobby kiosk Pi (192.168.42.64) sends its whole log here over TCP 514 (2026-11-21, home, dkeen asked).
# Its own journal lives in RAM (read-only SD + overlay) and is wiped at every reboot; this copy is kept.
# File: /var/log/remote/kiosk.log (logrotate: daily, 90 days, /etc/logrotate.d/remote-kiosk).
# Only the kiosk address is accepted; anything else arriving on 514 is dropped.
module(load="imtcp")
$AllowedSender TCP, 192.168.42.64
input(type="imtcp" port="514" ruleset="remote")
ruleset(name="remote") {
  if $fromhost-ip == "192.168.42.64" then {
    action(type="omfile" file="/var/log/remote/kiosk.log" template="RSYSLOG_FileFormat")
  }
  stop
}
#----- logrotate: /etc/logrotate.d/remote-kiosk
# # Lobby kiosk log sent from the kiosk Pi (see /etc/rsyslog.d/30-remote-kiosk.conf)
# /var/log/remote/kiosk.log {
#     daily
#     rotate 90
#     dateext
#     missingok
#     notifempty
#     compress
#     delaycompress
#     postrotate
#         /usr/lib/rsyslog/rsyslog-rotate
#     endscript
# }
#----- firewall (nas uses iptables-persistent, default DROP): /etc/iptables/rules.v4
# -A INPUT -s 192.168.42.64/32 -p tcp -m tcp --dport 514 -m comment --comment "kiosk log to rsyslog (2026-11-21)" -j ACCEPT
